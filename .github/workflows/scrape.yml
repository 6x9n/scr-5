name: scrape-student-results

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: scrape-results
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout branch (avoid detached HEAD)
        run: git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"

      - name: Run scraper
        run: python -u scrape.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Final safety commit
        if: always()
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "checkpoint: auto-save (job ended)"
            git push origin HEAD
          fi